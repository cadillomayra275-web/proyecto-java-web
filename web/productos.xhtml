<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"><h:head><title>Productos</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/></h:head><h:body><main class="container py-4"><h2>Productos</h2><h:form><div class="row g-2 my-3"><div class="col"><h:inputText value="#{productoBean.producto.codigo}" styleClass="form-control" pt:placeholder="Código" xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"/></div><div class="col"><h:inputText value="#{productoBean.producto.nombre}" styleClass="form-control" pt:placeholder="Nombre" xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"/></div><div class="col"><h:inputText value="#{productoBean.producto.precio}" styleClass="form-control" pt:placeholder="Precio" xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"/></div><div class="col"><h:commandButton value="Guardar" action="#{productoBean.guardar}" styleClass="btn btn-danger"/></div></div><h:dataTable value="#{productoBean.productos}" var="p" styleClass="table table-striped"><h:column><f:facet name="header" xmlns:f="http://xmlns.jcp.org/jsf/core">Código</f:facet>#{p.codigo}</h:column><h:column><f:facet name="header" xmlns:f="http://xmlns.jcp.org/jsf/core">Producto</f:facet>#{p.nombre}</h:column><h:column><f:facet name="header" xmlns:f="http://xmlns.jcp.org/jsf/core">Stock</f:facet>#{p.stock}</h:column></h:dataTable></h:form></main></h:body></html>
